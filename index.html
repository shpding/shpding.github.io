<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>身份证采集</title>
    <style>
        :root {
            --frame-color: rgba(0, 200, 100, 0.7);
            --frame-color-active: rgba(0, 255, 80, 0.9);
            --frame-color-warning: rgba(255, 180, 0, 0.8);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #000;
            overflow: hidden;
            height: 100dvh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* ========== 摄像头区域 ========== */
        .scanner-container {
            position: relative;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background: #000;
        }

        #videoElement {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* 镜像，更方便对齐 */
        }

        /* ========== 参考框叠加层 ========== */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .reference-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            /* 默认尺寸，JS中动态计算 */
            border: 2.5px solid var(--frame-color);
            border-radius: 6px;
            box-shadow:
                0 0 0 9999px rgba(0, 0, 0, 0.55),
                inset 0 0 30px rgba(0, 200, 100, 0.08);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .reference-frame.detected {
            border-color: var(--frame-color-active);
            box-shadow:
                0 0 0 9999px rgba(0, 0, 0, 0.55),
                inset 0 0 30px rgba(0, 255, 80, 0.12),
                0 0 20px rgba(0, 255, 80, 0.15);
        }

        .reference-frame.capturing {
            border-color: #fff;
            box-shadow:
                0 0 0 9999px rgba(0, 0, 0, 0.7),
                0 0 40px rgba(255, 255, 255, 0.3);
        }

        /* 四角标记 */
        .corner {
            position: absolute;
            width: 28px;
            height: 28px;
            border-color: var(--frame-color);
            border-style: solid;
            transition: all 0.3s ease;
        }
        .corner-tl { top: -3px; left: -3px; border-width: 4px 0 0 4px; border-radius: 4px 0 0 0; }
        .corner-tr { top: -3px; right: -3px; border-width: 4px 4px 0 0; border-radius: 0 4px 0 0; }
        .corner-bl { bottom: -3px; left: -3px; border-width: 0 0 4px 4px; border-radius: 0 0 0 4px; }
        .corner-br { bottom: -3px; right: -3px; border-width: 0 4px 4px 0; border-radius: 0 0 4px 0; }

        .detected .corner {
            border-color: var(--frame-color-active);
            width: 34px;
            height: 34px;
        }

        /* ========== 状态提示 ========== */
        .status-bar {
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            padding: 10px 24px;
            border-radius: 24px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #fff;
            font-size: 15px;
            letter-spacing: 0.5px;
            text-align: center;
            transition: all 0.3s ease;
            pointer-events: none;
            white-space: nowrap;
        }

        .status-bar.capturing {
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            font-size: 16px;
            animation: pulse-text 1.5s ease-in-out infinite;
        }

        @keyframes pulse-text {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .tilt-indicator {
            position: absolute;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            padding: 6px 16px;
            border-radius: 14px;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #aaa;
            font-size: 13px;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .tilt-indicator.good {
            color: #4cff88;
        }
        .tilt-indicator.warn {
            color: #ffb400;
        }

        /* ========== 检测点可视化Canvas ========== */
        #debugCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 15;
            transform: scaleX(-1);
        }

        /* ========== 加载遮罩 ========== */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            transition: opacity 0.4s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #4cff88;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 15px;
            color: #aaa;
        }

        /* ========== 结果展示 ========== */
        .result-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }

        .result-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .result-card {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            max-width: 90vw;
            max-height: 82vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .result-card h3 {
            font-size: 18px;
            color: #333;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .result-image-wrapper {
            position: relative;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            margin-bottom: 20px;
            max-width: 100%;
            max-height: 55vh;
            /* 棋盘格背景，展示透明/白色边缘 */
            background-image:
                linear-gradient(45deg, #e0e0e0 25%, transparent 25%),
                linear-gradient(-45deg, #e0e0e0 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #e0e0e0 75%),
                linear-gradient(-45deg, transparent 75%, #e0e0e0 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0;
            background-color: #f5f5f5;
        }

        .result-image-wrapper img {
            display: block;
            max-width: 100%;
            max-height: 55vh;
            object-fit: contain;
        }

        .result-info {
            font-size: 13px;
            color: #888;
            margin-bottom: 20px;
            text-align: center;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: #4cff88;
            color: #111;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.15);
            color: #fff;
            border: 1.5px solid rgba(255,255,255,0.3);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.25);
        }

        /* ========== 权限按钮 ========== */
        .permission-prompt {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 50;
            text-align: center;
            color: #fff;
        }

        .permission-prompt .btn {
            margin-top: 16px;
        }

        /* ========== 错误状态 ========== */
        .error-toast {
            position: absolute;
            top: 6%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 300;
            padding: 10px 20px;
            border-radius: 8px;
            background: rgba(255, 60, 60, 0.9);
            color: #fff;
            font-size: 14px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .error-toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="scanner-container" id="scannerContainer">
        <!-- 摄像头画面 -->
        <video id="videoElement" playsinline autoplay muted></video>

        <!-- 检测点可视化 -->
        <canvas id="debugCanvas"></canvas>

        <!-- 参考框叠加层 -->
        <div class="overlay" id="overlay">
            <div class="reference-frame" id="referenceFrame">
                <div class="corner corner-tl"></div>
                <div class="corner corner-tr"></div>
                <div class="corner corner-bl"></div>
                <div class="corner corner-br"></div>
            </div>
        </div>

        <!-- 状态提示 -->
        <div class="tilt-indicator" id="tiltIndicator">请将身份证对准框内</div>
        <div class="status-bar" id="statusBar">保持稳定，自动识别中…</div>

        <!-- 加载遮罩 -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">正在加载识别引擎…</div>
        </div>

        <!-- 错误提示 -->
        <div class="error-toast" id="errorToast"></div>

        <!-- 结果展示 -->
        <div class="result-overlay" id="resultOverlay">
            <div class="result-card">
                <h3>✓ 采集完成</h3>
                <div class="result-image-wrapper">
                    <img id="resultImage" alt="身份证采集结果" />
                </div>
                <div class="result-info" id="resultInfo"></div>
                <div class="btn-group">
                    <button class="btn btn-primary" id="btnDownload">下载图片</button>
                    <button class="btn btn-primary" id="btnCopy" style="background:#5b9aff;color:#fff;">复制到剪贴板</button>
                    <button class="btn btn-secondary" id="btnRetake">重新拍摄</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 隐藏的处理Canvas -->
    <canvas id="processCanvas" style="display:none;"></canvas>

    <!-- OpenCV.js -->
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" id="opencvScript"></script>

    <script>
    (function() {
        // ==================== DOM 引用 ====================
        const videoEl = document.getElementById('videoElement');
        const debugCanvas = document.getElementById('debugCanvas');
        const debugCtx = debugCanvas.getContext('2d');
        const processCanvas = document.getElementById('processCanvas');
        const processCtx = processCanvas.getContext('2d', { willReadFrequently: true });
        const referenceFrame = document.getElementById('referenceFrame');
        const statusBar = document.getElementById('statusBar');
        const tiltIndicator = document.getElementById('tiltIndicator');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');
        const errorToast = document.getElementById('errorToast');
        const resultOverlay = document.getElementById('resultOverlay');
        const resultImage = document.getElementById('resultImage');
        const resultInfo = document.getElementById('resultInfo');
        const scannerContainer = document.getElementById('scannerContainer');

        // ==================== 常量 ====================
        const ID_CARD_RATIO = 1.586; // 身份证宽高比 85.6/54
        const MAX_TILT_DEGREES = 5;   // 最大允许倾斜角度
        const PROCESS_INTERVAL_MS = 120; // 检测间隔
        const STABLE_FRAMES_REQUIRED = 4; // 需要连续稳定帧数才触发拍照
        const CAPTURE_DELAY_MS = 600;  // 拍照前的稳定等待

        // ==================== 状态管理 ====================
        let cvReady = false;
        let cameraReady = false;
        let isProcessing = false;
        let isCapturing = false;
        let animationFrameId = null;
        let lastProcessTime = 0;
        let stableFrameCount = 0;
        let captureTimeoutId = null;
        let videoWidth = 0;
        let videoHeight = 0;
        let refFrameWidth = 0;
        let refFrameHeight = 0;
        let refFrameLeft = 0;
        let refFrameTop = 0;

        // ==================== Toast ====================
        let toastTimer;
        function showToast(msg, duration = 2500) {
            clearTimeout(toastTimer);
            errorToast.textContent = msg;
            errorToast.classList.add('show');
            toastTimer = setTimeout(() => errorToast.classList.remove('show'), duration);
        }

        // ==================== 参考框计算 ====================
        function updateReferenceFrame() {
            videoWidth = videoEl.videoWidth || 1280;
            videoHeight = videoEl.videoHeight || 720;

            // 参考框高度占视频高度的 60%
            refFrameHeight = Math.round(videoHeight * 0.60);
            refFrameWidth = Math.round(refFrameHeight * ID_CARD_RATIO);

            // 确保参考框不超出视频边界
            const maxWidth = videoWidth * 0.90;
            if (refFrameWidth > maxWidth) {
                refFrameWidth = Math.round(maxWidth);
                refFrameHeight = Math.round(refFrameWidth / ID_CARD_RATIO);
            }

            refFrameLeft = Math.round((videoWidth - refFrameWidth) / 2);
            refFrameTop = Math.round((videoHeight - refFrameHeight) / 2);

            // 更新CSS中参考框的显示尺寸（相对于屏幕）
            const containerWidth = scannerContainer.clientWidth;
            const containerHeight = scannerContainer.clientHeight;
            const scaleX = containerWidth / videoWidth;
            const scaleY = containerHeight / videoHeight;

            referenceFrame.style.width = (refFrameWidth * scaleX) + 'px';
            referenceFrame.style.height = (refFrameHeight * scaleY) + 'px';
        }

        // ==================== OpenCV 初始化 ====================
        function initOpenCV() {
            if (typeof cv !== 'undefined' && cv.Mat) {
                cvReady = true;
                loadingText.textContent = '引擎就绪，启动摄像头…';
                initCamera();
                return;
            }
            // 轮询等待 OpenCV.js 加载
            setTimeout(() => {
                if (typeof cv !== 'undefined' && cv.Mat) {
                    cvReady = true;
                    loadingText.textContent = '引擎就绪，启动摄像头…';
                    initCamera();
                } else {
                    initOpenCV();
                }
            }, 300);
        }

        // OpenCV.js 加载完成回调
        window.onOpenCvReady = function() {
            // 由轮询检测
        };

        // ==================== 摄像头初始化 ====================
        async function initCamera() {
            try {
                const constraints = {
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    },
                    audio: false
                };

                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                videoEl.srcObject = stream;

                videoEl.onloadedmetadata = () => {
                    videoEl.play();
                    cameraReady = true;
                    updateReferenceFrame();
                    setupCanvasSizes();
                    loadingOverlay.classList.add('hidden');
                    startProcessingLoop();
                    statusBar.textContent = '请将身份证放入框内';
                };
            } catch (err) {
                console.error('摄像头访问失败:', err);
                loadingText.textContent = '摄像头访问失败';
                if (err.name === 'NotAllowedError') {
                    showToast('请在浏览器设置中允许摄像头权限');
                } else if (err.name === 'NotFoundError') {
                    showToast('未检测到摄像头设备');
                } else {
                    showToast('摄像头启动失败: ' + err.message);
                }
            }
        }

        function setupCanvasSizes() {
            videoWidth = videoEl.videoWidth;
            videoHeight = videoEl.videoHeight;

            debugCanvas.width = videoWidth;
            debugCanvas.height = videoHeight;
            processCanvas.width = videoWidth;
            processCanvas.height = videoHeight;
        }

        // ==================== 图像处理核心 ====================
        function imageDataToMat(imageData) {
            const mat = new cv.Mat(imageData.height, imageData.width, cv.CV_8UC4);
            mat.data.set(new Uint8Array(imageData.data));
            return mat;
        }

        function matToImageData(mat) {
            const canvas = document.createElement('canvas');
            canvas.width = mat.cols;
            canvas.height = mat.rows;
            cv.imshow(canvas, mat);
            return canvas.getContext('2d').getImageData(0, 0, mat.cols, mat.rows);
        }

        /**
         * 对检测到的四个角点排序：左上、右上、右下、左下
         */
        function orderCorners(pts) {
            const rect = pts.map(p => ({ x: p.x, y: p.y }));

            // 按 x+y 排序，最小的是左上，最大的是右下
            rect.sort((a, b) => (a.x + a.y) - (b.x + b.y));
            const tl = rect[0];
            const br = rect[3];

            // 中间两个：按 x 区分，x 大的是右上，x 小的是左下
            const mid = [rect[1], rect[2]];
            mid.sort((a, b) => a.x - b.x);

            // 验证：x 小的如果 y 更大，说明排序反了
            if (mid[0].y > mid[1].y) {
                return [tl, mid[1], br, mid[0]]; // tl, tr, br, bl
            }
            return [tl, mid[0], br, mid[1]]; // tl, tr, br, bl
        }

        /**
         * 计算四边形的宽高比
         */
        function calculateAspectRatio(corners) {
            const topW = Math.hypot(corners[1].x - corners[0].x, corners[1].y - corners[0].y);
            const bottomW = Math.hypot(corners[2].x - corners[3].x, corners[2].y - corners[3].y);
            const leftH = Math.hypot(corners[3].x - corners[0].x, corners[3].y - corners[0].y);
            const rightH = Math.hypot(corners[2].x - corners[1].x, corners[2].y - corners[1].y);

            const avgW = (topW + bottomW) / 2;
            const avgH = (leftH + rightH) / 2;

            if (avgH === 0) return 0;
            return avgW / avgH;
        }

        /**
         * 计算四边形各边的倾斜角度
         * 返回最大偏差角度（度）
         */
        function calculateTilt(corners) {
            // corners: [tl, tr, br, bl]
            const topAngle = Math.atan2(corners[1].y - corners[0].y, corners[1].x - corners[0].x);
            const bottomAngle = Math.atan2(corners[2].y - corners[3].y, corners[2].x - corners[3].x);
            const leftAngle = Math.atan2(corners[3].y - corners[0].y, corners[3].x - corners[0].x);
            const rightAngle = Math.atan2(corners[2].y - corners[1].y, corners[2].x - corners[1].x);

            // 转为度，并计算与期望角度的偏差
            const topDeg = topAngle * 180 / Math.PI;
            const bottomDeg = bottomAngle * 180 / Math.PI;
            const leftDeg = leftAngle * 180 / Math.PI;
            const rightDeg = rightAngle * 180 / Math.PI;

            // 上下边期望接近 0°（水平），左右边期望接近 ±90°（垂直）
            const topDev = Math.abs(topDeg);
            const bottomDev = Math.abs(bottomDeg);
            const leftDev = Math.abs(90 - Math.abs(leftDeg));
            const rightDev = Math.abs(90 - Math.abs(rightDeg));

            return Math.max(topDev, bottomDev, leftDev, rightDev);
        }

        /**
         * 检查角点是否在参考框内（含一定容差）
         */
        function isInReferenceFrame(corners) {
            const margin = refFrameWidth * 0.08; // 8% 容差
            const frameLeft = refFrameLeft - margin;
            const frameTop = refFrameTop - margin;
            const frameRight = refFrameLeft + refFrameWidth + margin;
            const frameBottom = refFrameTop + refFrameHeight + margin;

            return corners.every(c =>
                c.x >= frameLeft && c.x <= frameRight &&
                c.y >= frameTop && c.y <= frameBottom
            );
        }

        /**
         * 主检测函数：从视频帧中检测身份证角点
         */
        function detectIDCardCorners(srcMat) {
            const gray = new cv.Mat();
            const blurred = new cv.Mat();
            const edges = new cv.Mat();
            const dilated = new cv.Mat();
            const contours = new cv.MatVector();
            const hierarchy = new cv.Mat();

            try {
                // 1. 灰度化
                cv.cvtColor(srcMat, gray, cv.COLOR_RGBA2GRAY);

                // 2. 高斯模糊降噪
                cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0);

                // 3. Canny边缘检测（自适应阈值）
                const medianVal = gray.data[Math.floor(gray.data.length / 2)] || 100;
                const lower = Math.max(0, Math.floor(medianVal * 0.5));
                const upper = Math.min(255, Math.floor(medianVal * 1.5));
                cv.Canny(blurred, edges, Math.max(lower, 30), Math.max(upper, 90));

                // 4. 膨胀连接断边
                cv.dilate(edges, dilated, cv.Mat.ones(2, 2, cv.CV_8U));

                // 5. 查找轮廓
                cv.findContours(dilated, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                let bestQuad = null;
                let maxArea = 0;
                const minArea = (videoWidth * videoHeight) * 0.03; // 最小面积阈值

                for (let i = 0; i < contours.size(); i++) {
                    const contour = contours.get(i);
                    const peri = cv.arcLength(contour, true);
                    const approx = new cv.Mat();
                    cv.approxPolyDP(contour, approx, 0.025 * peri, true);

                    if (approx.rows === 4) {
                        const area = cv.contourArea(approx);
                        if (area > minArea && area > maxArea) {
                            // 提取四个角点
                            const pts = [];
                            for (let j = 0; j < 4; j++) {
                                pts.push({
                                    x: approx.data32S[j * 2],
                                    y: approx.data32S[j * 2 + 1]
                                });
                            }
                            const ordered = orderCorners(pts);
                            const ar = calculateAspectRatio(ordered);

                            // 检查宽高比是否接近身份证比例 (±30% 容差)
                            if (Math.abs(ar - ID_CARD_RATIO) < 0.50) {
                                maxArea = area;
                                bestQuad = ordered;
                            }
                        }
                    }
                    approx.delete();
                }

                return bestQuad;
            } finally {
                gray.delete();
                blurred.delete();
                edges.delete();
                dilated.delete();
                contours.delete();
                hierarchy.delete();
            }
        }

        /**
         * 透视变换 + 零边距裁剪
         * 直接按身份证四边像素边界裁剪，不留任何留白
         */
        function performPerspectiveTransform(srcMat, corners) {
            // 计算输出尺寸：基于源点实际像素宽度
            const topWidth = Math.hypot(corners[1].x - corners[0].x, corners[1].y - corners[0].y);
            const bottomWidth = Math.hypot(corners[2].x - corners[3].x, corners[2].y - corners[3].y);
            const leftHeight = Math.hypot(corners[3].x - corners[0].x, corners[3].y - corners[0].y);
            const rightHeight = Math.hypot(corners[2].x - corners[1].x, corners[2].y - corners[1].y);

            const avgWidth = (topWidth + bottomWidth) / 2;
            const avgHeight = (leftHeight + rightHeight) / 2;

            // 输出尺寸严格按 1.586:1
            const outputWidth = Math.round(Math.max(avgWidth, avgHeight * ID_CARD_RATIO));
            const outputHeight = Math.round(outputWidth / ID_CARD_RATIO);

            // 源点：检测到的四个角
            const srcPts = cv.matFromArray(4, 1, cv.CV_32FC2, [
                corners[0].x, corners[0].y, // tl
                corners[1].x, corners[1].y, // tr
                corners[2].x, corners[2].y, // br
                corners[3].x, corners[3].y  // bl
            ]);

            // 目标点：正俯视矩形，零边距（从(0,0)开始）
            const dstPts = cv.matFromArray(4, 1, cv.CV_32FC2, [
                0, 0,                     // tl
                outputWidth - 1, 0,        // tr
                outputWidth - 1, outputHeight - 1, // br
                0, outputHeight - 1        // bl
            ]);

            const M = cv.getPerspectiveTransform(srcPts, dstPts);
            const dst = new cv.Mat();
            cv.warpPerspective(srcMat, dst, M, new cv.Size(outputWidth, outputHeight),
                cv.INTER_CUBIC, cv.BORDER_CONSTANT, new cv.Scalar(255, 255, 255, 255));

            srcPts.delete();
            dstPts.delete();
            M.delete();

            return dst;
        }

        /**
         * 边缘清理：去除算法补偿产生的微小白色边缘
         * 对四边各做 1px 的内缩裁剪，仅用于消除不自然的直线白边
         */
        function cleanEdges(mat, shrinkPx = 1) {
            const w = mat.cols - shrinkPx * 2;
            const h = mat.rows - shrinkPx * 2;
            if (w <= 0 || h <= 0) return mat;

            const roi = new cv.Rect(shrinkPx, shrinkPx, w, h);
            return mat.roi(roi).clone();
        }

        /**
         * 将处理后的Mat转为可显示的格式
         */
        function matToCanvas(mat, canvas) {
            canvas.width = mat.cols;
            canvas.height = mat.rows;
            cv.imshow(canvas, mat);
        }

        // ==================== 采集流程 ====================
        function triggerCapture(corners) {
            if (isCapturing) return;
            isCapturing = true;

            // 更新UI状态
            referenceFrame.classList.add('capturing');
            statusBar.textContent = '正在去除背景，请勿移动';
            statusBar.classList.add('capturing');

            // 短暂延迟确保画面稳定
            setTimeout(() => {
                executeCapture(corners);
            }, 300);
        }

        function executeCapture(corners) {
            try {
                // 1. 从视频获取当前帧
                processCtx.drawImage(videoEl, 0, 0, videoWidth, videoHeight);
                const frameData = processCtx.getImageData(0, 0, videoWidth, videoHeight);
                const srcMat = imageDataToMat(frameData);

                // 2. 执行透视变换
                const transformed = performPerspectiveTransform(srcMat, corners);

                // 3. 转换为可显示的Canvas图像
                const resultCanvas = document.createElement('canvas');
                matToCanvas(transformed, resultCanvas);

                // 4. 输出为PNG（带透明背景的格式，但这里是JPEG质量的PNG）
                const dataUrl = resultCanvas.toDataURL('image/png', 1.0);

                // 5. 显示结果
                showResult(dataUrl, transformed.cols, transformed.rows);

                // 清理
                srcMat.delete();
                transformed.delete();

            } catch (err) {
                console.error('采集处理失败:', err);
                showToast('处理失败，请重试');
                resetCaptureState();
            }
        }

        function showResult(dataUrl, width, height) {
            resultImage.src = dataUrl;
            resultInfo.textContent = `尺寸: ${width} × ${height} px  |  比例: ${(width / height).toFixed(3)}:1`;
            resultOverlay.classList.add('visible');

            // 停止视频流
            stopProcessing();

            // 设置按钮事件
            document.getElementById('btnDownload').onclick = () => {
                const a = document.createElement('a');
                a.href = dataUrl;
                a.download = `身份证_${width}x${height}.png`;
                a.click();
            };

            document.getElementById('btnCopy').onclick = async () => {
                try {
                    const blob = await (await fetch(dataUrl)).blob();
                    await navigator.clipboard.write([
                        new ClipboardItem({ [blob.type]: blob })
                    ]);
                    showToast('已复制到剪贴板');
                } catch (e) {
                    showToast('复制失败，请长按图片保存');
                }
            };

            document.getElementById('btnRetake').onclick = () => {
                resultOverlay.classList.remove('visible');
                resetCaptureState();
                startProcessingLoop();
                videoEl.play();
            };
        }

        function resetCaptureState() {
            isCapturing = false;
            stableFrameCount = 0;
            referenceFrame.classList.remove('capturing', 'detected');
            statusBar.classList.remove('capturing');
            statusBar.textContent = '请将身份证放入框内';
            tiltIndicator.textContent = '请将身份证对准框内';
            tiltIndicator.className = 'tilt-indicator';
        }

        // ==================== 主处理循环 ====================
        function startProcessingLoop() {
            function loop(timestamp) {
                if (isCapturing || resultOverlay.classList.contains('visible')) {
                    animationFrameId = requestAnimationFrame(loop);
                    return;
                }

                // 控制处理频率
                if (timestamp - lastProcessTime < PROCESS_INTERVAL_MS) {
                    animationFrameId = requestAnimationFrame(loop);
                    return;
                }
                lastProcessTime = timestamp;

                if (!cvReady || !cameraReady || videoEl.readyState < 2) {
                    animationFrameId = requestAnimationFrame(loop);
                    return;
                }

                // 更新参考框尺寸（处理视频尺寸变化）
                if (videoEl.videoWidth !== videoWidth || videoEl.videoHeight !== videoHeight) {
                    updateReferenceFrame();
                    setupCanvasSizes();
                }

                // 从视频获取当前帧
                processCtx.drawImage(videoEl, 0, 0, videoWidth, videoHeight);
                const frameData = processCtx.getImageData(0, 0, videoWidth, videoHeight);
                const srcMat = imageDataToMat(frameData);

                // 检测身份证角点
                const corners = detectIDCardCorners(srcMat);
                srcMat.delete();

                // 绘制检测可视化
                drawDebugOverlay(corners);

                if (corners) {
                    const tilt = calculateTilt(corners);
                    const inFrame = isInReferenceFrame(corners);

                    // 更新倾斜指示器
                    if (tilt < MAX_TILT_DEGREES) {
                        tiltIndicator.textContent = `倾斜: ${tilt.toFixed(1)}° ✓`;
                        tiltIndicator.className = 'tilt-indicator good';
                    } else {
                        tiltIndicator.textContent = `倾斜: ${tilt.toFixed(1)}° 请摆正`;
                        tiltIndicator.className = 'tilt-indicator warn';
                    }

                    // 判断是否满足自动拍照条件
                    if (tilt < MAX_TILT_DEGREES && inFrame) {
                        referenceFrame.classList.add('detected');
                        stableFrameCount++;

                        if (stableFrameCount >= STABLE_FRAMES_REQUIRED) {
                            statusBar.textContent = '识别成功，即将自动拍照…';
                            if (!captureTimeoutId) {
                                captureTimeoutId = setTimeout(() => {
                                    captureTimeoutId = null;
                                    triggerCapture(corners);
                                }, CAPTURE_DELAY_MS);
                            }
                        } else {
                            statusBar.textContent = `保持稳定… (${stableFrameCount}/${STABLE_FRAMES_REQUIRED})`;
                        }
                    } else {
                        referenceFrame.classList.remove('detected');
                        stableFrameCount = 0;
                        if (captureTimeoutId) {
                            clearTimeout(captureTimeoutId);
                            captureTimeoutId = null;
                        }
                        statusBar.textContent = inFrame
                            ? '请摆正身份证 (倾斜角度过大)'
                            : '请将身份证放入框内';
                    }
                } else {
                    referenceFrame.classList.remove('detected');
                    stableFrameCount = 0;
                    if (captureTimeoutId) {
                        clearTimeout(captureTimeoutId);
                        captureTimeoutId = null;
                    }
                    tiltIndicator.textContent = '请将身份证对准框内';
                    tiltIndicator.className = 'tilt-indicator';
                    statusBar.textContent = '正在搜索身份证…';
                }

                animationFrameId = requestAnimationFrame(loop);
            }

            animationFrameId = requestAnimationFrame(loop);
        }

        function stopProcessing() {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
            if (captureTimeoutId) {
                clearTimeout(captureTimeoutId);
                captureTimeoutId = null;
            }
        }

        /**
         * 在调试Canvas上绘制检测到的角点和连线
         */
        function drawDebugOverlay(corners) {
            debugCtx.clearRect(0, 0, debugCanvas.width, debugCanvas.height);

            if (!corners) return;

            // 绘制角点
            corners.forEach((c, i) => {
                debugCtx.beginPath();
                debugCtx.arc(c.x, c.y, 8, 0, Math.PI * 2);
                const colors = ['#ff4444', '#44ff44', '#4444ff', '#ffaa00'];
                debugCtx.fillStyle = colors[i];
                debugCtx.fill();
                debugCtx.strokeStyle = '#fff';
                debugCtx.lineWidth = 2;
                debugCtx.stroke();
            });

            // 绘制连线
            debugCtx.strokeStyle = 'rgba(0, 255, 100, 0.7)';
            debugCtx.lineWidth = 2.5;
            debugCtx.setLineDash([6, 3]);
            debugCtx.beginPath();
            debugCtx.moveTo(corners[0].x, corners[0].y);
            debugCtx.lineTo(corners[1].x, corners[1].y);
            debugCtx.lineTo(corners[2].x, corners[2].y);
            debugCtx.lineTo(corners[3].x, corners[3].y);
            debugCtx.closePath();
            debugCtx.stroke();
            debugCtx.setLineDash([]);
        }

        // ==================== 窗口大小自适应 ====================
        function handleResize() {
            updateReferenceFrame();
            setupCanvasSizes();
        }

        window.addEventListener('resize', handleResize);
        window.addEventListener('orientationchange', () => {
            setTimeout(handleResize, 300);
        });

        // ==================== 启动 ====================
        function bootstrap() {
            // 检测是否为HTTPS或localhost
            const isSecure = location.protocol === 'https:' ||
                location.hostname === 'localhost' ||
                location.hostname === '127.0.0.1';

            if (!isSecure && !location.hostname.includes('10.2.35')) {
                // 对于自签名HTTPS调试地址允许通过
                loadingText.textContent = '需要HTTPS环境才能使用摄像头';
                return;
            }

            // 检测OpenCV
            if (typeof cv !== 'undefined' && cv.Mat) {
                cvReady = true;
                loadingText.textContent = '引擎就绪，启动摄像头…';
                initCamera();
            } else {
                // OpenCV 仍在加载
                initOpenCV();
            }
        }

        // 页面加载完成后启动
        if (document.readyState === 'complete') {
            bootstrap();
        } else {
            window.addEventListener('load', bootstrap);
        }

        // ==================== 页面销毁时清理 ====================
        window.addEventListener('beforeunload', () => {
            stopProcessing();
            if (videoEl.srcObject) {
                videoEl.srcObject.getTracks().forEach(t => t.stop());
            }
        });
    })();
    </script>
</body>
