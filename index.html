<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>身份证智能识别采集</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #16161f;
            --text: #e8e8ed;
            --text-secondary: #9898a8;
            --red: #FF0000;
            --red-glow: rgba(255, 0, 0, 0.35);
            --green: #00FF00;
            --green-glow: rgba(0, 255, 0, 0.35);
            --accent: #3b82f6;
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* ── 顶部状态栏 ── */
        .status-bar {
            padding: 12px 16px;
            background: var(--surface);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 100;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .status-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: var(--red);
            transition: background 0.3s, box-shadow 0.3s;
            flex-shrink: 0;
        }
        .status-dot.green {
            background: var(--green);
            box-shadow: 0 0 12px var(--green-glow);
        }
        .status-text {
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s;
        }
        .status-text.green { color: var(--green); }

        /* ── 核心预览区 ── */
        .preview-area {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
        }
        .preview-area video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .preview-area canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        /* 半透明遮罩 */
        .overlay-mask {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 3;
            pointer-events: none;
        }
        .overlay-mask svg {
            width: 100%; height: 100%;
        }

        /* 取景框 */
        .guide-frame {
            position: absolute;
            z-index: 4;
            pointer-events: none;
            border: 3px solid var(--red);
            border-radius: 2px;
            transition: border-color 0.35s, box-shadow 0.35s;
        }
        .guide-frame.green {
            border-color: var(--green);
            box-shadow: 0 0 20px var(--green-glow), inset 0 0 20px var(--green-glow);
        }
        .guide-frame.red {
            border-color: var(--red);
            box-shadow: 0 0 16px var(--red-glow), inset 0 0 16px var(--red-glow);
        }

        /* 取景框四角标记 */
        .corner-marker {
            position: absolute;
            width: 18px; height: 18px;
            z-index: 5;
            pointer-events: none;
            transition: all 0.3s;
        }
        .corner-marker::before {
            content: '';
            position: absolute;
            inset: 0;
            border: 3px solid;
            border-radius: 2px;
            transition: border-color 0.35s;
        }
        .corner-marker.tl { top: -3px; left: -3px; }
        .corner-marker.tr { top: -3px; right: -3px; }
        .corner-marker.bl { bottom: -3px; left: -3px; }
        .corner-marker.br { bottom: -3px; right: -3px; }
        .corner-marker.red::before { border-color: var(--red); }
        .corner-marker.green::before { border-color: var(--green); }
        .corner-marker.tl::before { border-width: 3px 0 0 3px; border-radius: 4px 0 0 0; }
        .corner-marker.tr::before { border-width: 3px 3px 0 0; border-radius: 0 4px 0 0; }
        .corner-marker.bl::before { border-width: 0 0 3px 3px; border-radius: 0 0 0 4px; }
        .corner-marker.br::before { border-width: 0 3px 3px 0; border-radius: 0 0 4px 0; }

        /* 闪白效果 */
        .flash-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #fff;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.08s ease-out;
        }
        .flash-overlay.active {
            opacity: 0.85;
            transition: opacity 0.05s ease-in;
        }

        /* ── 缩略图 ── */
        .thumbnails {
            position: absolute;
            top: 12px; right: 12px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .thumb-item {
            width: 64px; height: 40px;
            border-radius: 6px;
            border: 2px solid rgba(255,255,255,0.15);
            background: var(--surface);
            object-fit: cover;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            transition: border-color 0.3s;
        }
        .thumb-item.captured {
            border-color: var(--green);
            animation: thumbPop 0.4s ease-out;
        }
        @keyframes thumbPop {
            0% { transform: scale(1.4); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }
        .thumb-label {
            font-size: 10px;
            color: var(--text-secondary);
            text-align: center;
        }

        /* ── 底部操作区 ── */
        .controls {
            padding: 12px 16px 20px;
            background: var(--surface);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-shrink: 0;
            border-top: 1px solid rgba(255,255,255,0.06);
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary {
            background: var(--accent);
            color: #fff;
        }
        .btn-primary:disabled {
            background: rgba(59,130,246,0.3);
            color: rgba(255,255,255,0.3);
            cursor: not-allowed;
        }
        .btn-secondary {
            background: rgba(255,255,255,0.08);
            color: var(--text);
        }
        .btn-icon {
            font-size: 18px;
            line-height: 1;
        }

        /* ── 错误状态 ── */
        .error-screen {
            position: absolute;
            inset: 0;
            z-index: 50;
            background: var(--bg);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 32px;
            text-align: center;
        }
        .error-screen.visible { display: flex; }
        .error-icon { font-size: 56px; }
        .error-title { font-size: 18px; font-weight: 700; }
        .error-desc { font-size: 14px; color: var(--text-secondary); line-height: 1.6; }

        /* ── 加载提示 ── */
        .loading-overlay {
            position: absolute;
            inset: 0;
            z-index: 60;
            background: rgba(10,10,15,0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            pointer-events: all;
        }
        .loading-overlay.hidden { display: none; }
        .spinner {
            width: 36px; height: 36px;
            border: 3px solid rgba(255,255,255,0.15);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 14px; color: var(--text-secondary); }

        /* ── 响应式 ── */
        @media (min-width: 768px) {
            .preview-area {
                max-width: 600px;
                margin: 16px auto;
                border-radius: var(--radius);
            }
            body { padding: 0 16px 16px; }
            .controls {
                border-radius: var(--radius);
                margin-top: 12px;
                max-width: 600px;
                align-self: center;
                width: 100%;
            }
        }

        @media (max-width: 380px) {
            .btn { padding: 8px 14px; font-size: 13px; }
            .status-text { font-size: 13px; }
            .thumb-item { width: 48px; height: 30px; }
        }
    </style>
</head>
<body>

    <!-- 顶部状态栏 -->
    <div class="status-bar">
        <div class="status-dot" id="statusDot"></div>
        <span class="status-text" id="statusText">正在初始化摄像头...</span>
    </div>

    <!-- 核心预览区 -->
    <div class="preview-area" id="previewArea">
        <video id="video" playsinline autoplay muted></video>
        <canvas id="overlayCanvas"></canvas>

        <!-- 半透明遮罩 + 取景框镂空 -->
        <div class="overlay-mask" id="overlayMask">
            <svg id="maskSvg" viewBox="0 0 100 100" preserveAspectRatio="none">
                <defs>
                    <mask id="holeMask">
                        <rect width="100" height="100" fill="white" />
                        <rect id="maskHole" x="0" y="0" width="60" height="37.85" fill="black" rx="1" />
                    </mask>
                </defs>
                <rect width="100" height="100" fill="rgba(0,0,0,0.55)" mask="url(#holeMask)" />
            </svg>
        </div>

        <!-- 取景框 -->
        <div class="guide-frame red" id="guideFrame">
            <div class="corner-marker tl red" id="cornerTL"></div>
            <div class="corner-marker tr red" id="cornerTR"></div>
            <div class="corner-marker bl red" id="cornerBL"></div>
            <div class="corner-marker br red" id="cornerBR"></div>
        </div>

        <!-- 缩略图 -->
        <div class="thumbnails" id="thumbnails">
            <span class="thumb-label">正面</span>
            <img class="thumb-item" id="thumbFront" src="" alt="正面缩略图" style="display:none">
            <span class="thumb-label">反面</span>
            <img class="thumb-item" id="thumbBack" src="" alt="反面缩略图" style="display:none">
        </div>

        <!-- 闪白 -->
        <div class="flash-overlay" id="flashOverlay"></div>

        <!-- 加载 -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
            <span class="loading-text" id="loadingText">正在加载 OpenCV.js...</span>
        </div>

        <!-- 错误 -->
        <div class="error-screen" id="errorScreen">
            <span class="error-icon">📷</span>
            <span class="error-title" id="errorTitle">摄像头不可用</span>
            <span class="error-desc" id="errorDesc">请检查摄像头权限，或使用下方"上传照片"功能</span>
            <button class="btn btn-primary" id="btnRetry">重试</button>
        </div>
    </div>

    <!-- 底部操作区 -->
    <div class="controls" id="controls">
        <button class="btn btn-secondary" id="btnSwitchCam" title="切换摄像头">
            <span class="btn-icon">🔄</span> 切换
        </button>
        <button class="btn btn-secondary" id="btnManualCapture" title="手动拍照">
            <span class="btn-icon">📸</span> 手动拍照
        </button>
        <button class="btn btn-secondary" id="btnReset" title="重新拍摄">
            <span class="btn-icon">↺</span> 重拍
        </button>
        <button class="btn btn-secondary" id="btnUpload" title="上传照片">
            <span class="btn-icon">📁</span> 上传
        </button>
        <button class="btn btn-primary" id="btnSubmit" disabled title="提交">
            <span class="btn-icon">✅</span> 提交
        </button>
        <!-- 隐藏的文件输入 -->
        <input type="file" id="fileInput" accept="image/*" style="display:none" multiple>
    </div>

    <script src="https://docs.opencv.org/4.10.0/opencv.js" async id="opencvScript"></script>

    <script>
    (function() {
        // ============== 常量 ==============
        const ID_CARD_ASPECT = 85.6 / 54.0;       // 身份证宽高比 ≈ 1.585
        const ASPECT_TOLERANCE = 0.18;             // 宽高比容差
        const MIN_AREA_RATIO = 0.08;               // 最小面积占比（相对画面）
        const STABLE_FRAMES_FOR_GREEN = 3;         // 连续合规帧数才变绿
        const STABLE_FRAMES_FOR_CAPTURE = 15;      // 连续合规帧数才抓拍（约800ms@60fps）
        const CAPTURE_COOLDOWN_MS = 1500;          // 抓拍冷却时间
        const OUTPUT_WIDTH = 856;                   // 输出图像宽度
        const DETECT_INTERVAL_MS = 50;             // 检测间隔（降低CPU负载）

        // ============== 状态 ==============
        const state = {
            side: 'front',
            frontImage: null,
            backImage: null,
            isGreen: false,
            greenFrameCount: 0,
            lastCaptureTime: 0,
            isProcessing: false,
            isStreaming: false,
            facingMode: 'environment',
            hasOpencv: false,
            opencvReady: false,
            videoReady: false,
            detectLoopId: null,
            currentStream: null,
            availableCameras: [],
        };

        // ============== DOM 引用 ==============
        const $ = id => document.getElementById(id);
        const dom = {
            video: $('video'),
            overlayCanvas: $('overlayCanvas'),
            overlayMask: $('overlayMask'),
            maskSvg: $('maskSvg'),
            maskHole: $('maskHole'),
            guideFrame: $('guideFrame'),
            cornerTL: $('cornerTL'),
            cornerTR: $('cornerTR'),
            cornerBL: $('cornerBL'),
            cornerBR: $('cornerBR'),
            flashOverlay: $('flashOverlay'),
            thumbFront: $('thumbFront'),
            thumbBack: $('thumbBack'),
            statusDot: $('statusDot'),
            statusText: $('statusText'),
            loadingOverlay: $('loadingOverlay'),
            loadingText: $('loadingText'),
            errorScreen: $('errorScreen'),
            errorTitle: $('errorTitle'),
            errorDesc: $('errorDesc'),
            btnRetry: $('btnRetry'),
            btnSwitchCam: $('btnSwitchCam'),
            btnManualCapture: $('btnManualCapture'),
            btnReset: $('btnReset'),
            btnUpload: $('btnUpload'),
            btnSubmit: $('btnSubmit'),
            fileInput: $('fileInput'),
            previewArea: $('previewArea'),
        };

        // ============== 工具函数 ==============
        function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

        function setStatus(text, color) {
            dom.statusText.textContent = text;
            dom.statusText.className = 'status-text' + (color ? ' ' + color : '');
        }

        function setGuideColor(color) {
            const frame = dom.guideFrame;
            const corners = [dom.cornerTL, dom.cornerTR, dom.cornerBL, dom.cornerBR];
            if (color === 'green') {
                frame.className = 'guide-frame green';
                corners.forEach(c => c.className = c.className.replace(/red|green/g, '') + ' green');
                dom.statusDot.className = 'status-dot green';
                state.isGreen = true;
            } else {
                frame.className = 'guide-frame red';
                corners.forEach(c => c.className = c.className.replace(/red|green/g, '') + ' red');
                dom.statusDot.className = 'status-dot';
                state.isGreen = false;
            }
        }

        function showFlash(done) {
            const el = dom.flashOverlay;
            el.classList.add('active');
            setTimeout(() => {
                el.classList.remove('active');
                if (done) setTimeout(done, 100);
            }, 100);
        }

        function showLoading(msg) {
            dom.loadingText.textContent = msg || '加载中...';
            dom.loadingOverlay.classList.remove('hidden');
        }

        function hideLoading() {
            dom.loadingOverlay.classList.add('hidden');
        }

        function showError(title, desc) {
            dom.errorTitle.textContent = title;
            dom.errorDesc.textContent = desc;
            dom.errorScreen.classList.add('visible');
        }

        function hideError() {
            dom.errorScreen.classList.remove('visible');
        }

        // 计算取景框在预览区中的像素坐标
        function getGuideFrameRect() {
            const area = dom.previewArea;
            const aw = area.clientWidth;
            const ah = area.clientHeight;

            // 取景框占预览区 70% 宽度
            const gW = aw * 0.7;
            const gH = gW / ID_CARD_ASPECT;

            // 限制高度不超过 85% 区域高度
            let frameH = gH;
            let frameW = gW;
            if (frameH > ah * 0.85) {
                frameH = ah * 0.85;
                frameW = frameH * ID_CARD_ASPECT;
            }

            const gX = (aw - frameW) / 2;
            const gY = (ah - frameH) / 2;

            return { x: gX, y: gY, w: frameW, h: frameH, right: gX + frameW, bottom: gY + frameH };
        }

        // 更新取景框 UI 位置
        function updateGuideFrameUI() {
            const r = getGuideFrameRect();
            const guide = dom.guideFrame;
            guide.style.left = r.x + 'px';
            guide.style.top = r.y + 'px';
            guide.style.width = r.w + 'px';
            guide.style.height = r.h + 'px';

            // 更新 SVG 遮罩镂空
            const area = dom.previewArea;
            const aw = area.clientWidth;
            const ah = area.clientHeight;
            if (aw > 0 && ah > 0) {
                dom.maskSvg.setAttribute('viewBox', `0 0 ${aw} ${ah}`);
                dom.maskHole.setAttribute('x', r.x);
                dom.maskHole.setAttribute('y', r.y);
                dom.maskHole.setAttribute('width', r.w);
                dom.maskHole.setAttribute('height', r.h);
                dom.maskHole.setAttribute('rx', '2');
            }
        }

        // 同步 canvas 尺寸
        function syncCanvasSize() {
            const area = dom.previewArea;
            const cw = area.clientWidth;
            const ch = area.clientHeight;
            if (dom.overlayCanvas.width !== cw || dom.overlayCanvas.height !== ch) {
                dom.overlayCanvas.width = cw;
                dom.overlayCanvas.height = ch;
            }
        }

        // ============== 摄像头管理 ==============
        async function enumerateCameras() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                state.availableCameras = devices.filter(d => d.kind === 'videoinput');
            } catch (e) {
                state.availableCameras = [];
            }
        }

        async function startCamera(facingMode) {
            hideError();
            state.facingMode = facingMode || state.facingMode;

            // 停止旧流
            if (state.currentStream) {
                state.currentStream.getTracks().forEach(t => t.stop());
                state.currentStream = null;
            }

            const constraints = {
                video: {
                    facingMode: state.facingMode,
                    width: { ideal: 1920 },
                    height: { ideal: 1080 },
                },
                audio: false,
            };

            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                state.currentStream = stream;
                dom.video.srcObject = stream;
                await dom.video.play();
                state.isStreaming = true;
                state.videoReady = true;

                await enumerateCameras();

                // 如果只有 1 个摄像头，隐藏切换按钮
                dom.btnSwitchCam.style.display = state.availableCameras.length > 1 ? '' : 'none';

                updateGuideFrameUI();
                setStatus('请将身份证正面放入框内');
                setGuideColor('red');

                // 开始检测循环
                startDetectLoop();

            } catch (err) {
                console.error('摄像头启动失败:', err);
                state.isStreaming = false;
                if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                    showError('摄像头权限被拒绝', '请在浏览器设置中允许本页面使用摄像头，或使用"上传照片"功能');
                } else if (err.name === 'NotFoundError') {
                    showError('未检测到摄像头', '请确认设备已连接摄像头，或使用"上传照片"功能');
                } else {
                    showError('摄像头不可用', err.message || '未知错误，请尝试使用"上传照片"功能');
                }
            }
        }

        function switchCamera() {
            if (state.isProcessing) return;
            state.facingMode = (state.facingMode === 'environment') ? 'user' : 'environment';
            stopDetectLoop();
            startCamera(state.facingMode);
        }

        // ============== OpenCV.js 初始化 ==============
        function initOpencv() {
            return new Promise((resolve) => {
                if (typeof cv !== 'undefined' && cv.Mat) {
                    state.hasOpencv = true;
                    state.opencvReady = true;
                    resolve(true);
                    return;
                }

                const script = document.getElementById('opencvScript');
                if (!script) {
                    resolve(false);
                    return;
                }

                // 监听 OpenCV 就绪
                const onReady = () => {
                    state.hasOpencv = true;
                    state.opencvReady = true;
                    resolve(true);
                };

                if (typeof cv !== 'undefined') {
                    // 可能已加载但未就绪
                    if (cv.Mat) {
                        onReady();
                        return;
                    }
                    cv['onRuntimeInitialized'] = onReady;
                } else {
                    // 给脚本加载事件绑定
                    script.addEventListener('load', () => {
                        // 等待 cv 对象出现
                        let attempts = 0;
                        const check = setInterval(() => {
                            attempts++;
                            if (typeof cv !== 'undefined') {
                                clearInterval(check);
                                if (cv.Mat) {
                                    onReady();
                                } else {
                                    cv['onRuntimeInitialized'] = onReady;
                                }
                            } else if (attempts > 100) {
                                clearInterval(check);
                                resolve(false);
                            }
                        }, 200);
                    });

                    // 超时回退（15秒）
                    setTimeout(() => {
                        if (!state.opencvReady) resolve(false);
                    }, 15000);
                }
            });
        }

        // ============== 身份证检测算法 (OpenCV.js) ==============
        function detectIDCardWithOpencv() {
            if (!state.opencvReady || !state.videoReady) return null;

            const video = dom.video;
            if (video.readyState < 2) return null;

            const src = new cv.Mat(video.videoHeight, video.videoWidth, cv.CV_8UC4);
            try {
                const cap = new cv.VideoCapture(video);
                cap.read(src);
                cap.delete();

                const gray = new cv.Mat();
                const blurred = new cv.Mat();
                const edges = new cv.Mat();
                const contours = new cv.MatVector();
                const hierarchy = new cv.Mat();

                cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
                cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0);
                cv.Canny(blurred, edges, 60, 180);

                cv.findContours(edges, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                const imgArea = video.videoWidth * video.videoHeight;
                const minArea = imgArea * MIN_AREA_RATIO;

                let bestQuad = null;
                let bestScore = -Infinity;
                const targetRatio = ID_CARD_ASPECT;

                for (let i = 0; i < contours.size(); i++) {
                    const contour = contours.get(i);
                    const area = cv.contourArea(contour);
                    if (area < minArea) continue;

                    const peri = cv.arcLength(contour, true);
                    const approx = new cv.Mat();
                    cv.approxPolyDP(contour, approx, 0.02 * peri, true);

                    if (approx.rows === 4 && approx.cols === 1 && approx.type() === cv.CV_32SC2) {
                        // 排序四个顶点：左上、右上、右下、左下
                        const pts = [];
                        for (let j = 0; j < 4; j++) {
                            pts.push({ x: approx.intPtr(j, 0)[0], y: approx.intPtr(j, 0)[1] });
                        }

                        const ordered = orderPoints(pts);
                        if (!ordered) { approx.delete(); continue; }

                        const w1 = dist(ordered[0], ordered[1]);
                        const w2 = dist(ordered[2], ordered[3]);
                        const h1 = dist(ordered[0], ordered[3]);
                        const h2 = dist(ordered[1], ordered[2]);
                        const avgW = (w1 + w2) / 2;
                        const avgH = (h1 + h2) / 2;
                        if (avgW === 0 || avgH === 0) { approx.delete(); continue; }

                        const ratio = avgW / avgH;
                        if (Math.abs(ratio - targetRatio) > ASPECT_TOLERANCE) { approx.delete(); continue; }

                        // 矩形度评分
                        const ratioScore = 1 - Math.abs(ratio - targetRatio) / ASPECT_TOLERANCE;
                        const score = ratioScore * 0.7 + (area / imgArea) * 0.3;

                        if (score > bestScore) {
                            bestScore = score;
                            bestQuad = ordered;
                        }
                    }
                    approx.delete();
                }

                gray.delete(); blurred.delete(); edges.delete();
                contours.delete(); hierarchy.delete();
                src.delete();

                return bestQuad;

            } catch (e) {
                console.warn('OpenCV检测异常:', e);
                try { src.delete(); } catch (_) {}
                return null;
            }
        }

        // ============== 纯 Canvas 降级检测 ==============
        function detectIDCardFallback() {
            if (!state.videoReady) return null;

            const video = dom.video;
            if (video.readyState < 2) return null;

            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const { data, width, height } = imgData;

            // 转灰度 + 自适应二值化
            const gray = new Uint8Array(width * height);
            for (let i = 0; i < width * height; i++) {
                const r = data[i * 4];
                const g = data[i * 4 + 1];
                const b = data[i * 4 + 2];
                gray[i] = (r * 0.299 + g * 0.587 + b * 0.114);
            }

            // 大津法二值化
            const bin = otsuThreshold(gray, width, height);

            // 简化的轮廓查找：扫描连通区域
            const regions = findRectangularRegions(bin, width, height);
            if (regions.length === 0) return null;

            // 筛选最符合身份证比例的区域
            const imgArea = width * height;
            const minArea = imgArea * MIN_AREA_RATIO;
            const targetRatio = ID_CARD_ASPECT;

            let bestRegion = null;
            let bestScore = -Infinity;

            for (const r of regions) {
                const area = r.w * r.h;
                if (area < minArea) continue;
                const ratio = r.w / r.h;
                if (Math.abs(ratio - targetRatio) > ASPECT_TOLERANCE) continue;

                const score = 1 - Math.abs(ratio - targetRatio) / ASPECT_TOLERANCE;
                if (score > bestScore) {
                    bestScore = score;
                    bestRegion = r;
                }
            }

            if (!bestRegion) return null;

            return [
                { x: bestRegion.x, y: bestRegion.y },
                { x: bestRegion.x + bestRegion.w, y: bestRegion.y },
                { x: bestRegion.x + bestRegion.w, y: bestRegion.y + bestRegion.h },
                { x: bestRegion.x, y: bestRegion.y + bestRegion.h },
            ];
        }

        function otsuThreshold(gray, width, height) {
            const hist = new Uint32Array(256);
            for (let i = 0; i < gray.length; i++) hist[gray[i]]++;
            const total = gray.length;
            let sumB = 0, wB = 0, maxVariance = 0, threshold = 128;
            const sumTotal = hist.reduce((a, v, i) => a + v * i, 0);
            for (let t = 0; t < 256; t++) {
                wB += hist[t];
                if (wB === 0) continue;
                const wF = total - wB;
                if (wF === 0) break;
                sumB += t * hist[t];
                const mB = sumB / wB;
                const mF = (sumTotal - sumB) / wF;
                const variance = wB * wF * (mB - mF) ** 2;
                if (variance > maxVariance) { maxVariance = variance; threshold = t; }
            }
            const bin = new Uint8Array(gray.length);
            for (let i = 0; i < gray.length; i++) bin[i] = gray[i] > threshold ? 255 : 0;
            return bin;
        }

        function findRectangularRegions(bin, width, height) {
            const regions = [];
            const visited = new Uint8Array(bin.length);
            const minSize = 20;

            for (let y = 0; y < height; y += 4) {
                for (let x = 0; x < width; x += 4) {
                    const idx = y * width + x;
                    if (visited[idx] || bin[idx] !== 255) continue;

                    // BFS 找连通区域
                    let minX = x, maxX = x, minY = y, maxY = y;
                    let count = 0;
                    const queue = [[x, y]];
                    visited[idx] = 1;

                    while (queue.length > 0 && count < 50000) {
                        const [cx, cy] = queue.shift();
                        count++;
                        minX = Math.min(minX, cx); maxX = Math.max(maxX, cx);
                        minY = Math.min(minY, cy); maxY = Math.max(maxY, cy);

                        for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
                            const nx = cx + dx, ny = cy + dy;
                            if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                                const ni = ny * width + nx;
                                if (!visited[ni] && bin[ni] === 255) {
                                    visited[ni] = 1;
                                    queue.push([nx, ny]);
                                }
                            }
                        }
                    }

                    const rw = maxX - minX;
                    const rh = maxY - minY;
                    if (rw > minSize && rh > minSize && count > (rw * rh * 0.4)) {
                        regions.push({ x: minX, y: minY, w: rw, h: rh, area: count });
                    }
                }
            }

            // 按面积排序
            regions.sort((a, b) => b.area - a.area);
            // 去重叠：保留面积大的
            const filtered = [];
            for (const r of regions) {
                let overlaps = false;
                for (const f of filtered) {
                    const ox = Math.max(0, Math.min(r.x + r.w, f.x + f.w) - Math.max(r.x, f.x));
                    const oy = Math.max(0, Math.min(r.y + r.h, f.y + f.h) - Math.max(r.y, f.y));
                    if (ox * oy > r.w * r.h * 0.5) { overlaps = true; break; }
                }
                if (!overlaps) filtered.push(r);
                if (filtered.length >= 5) break;
            }

            return filtered;
        }

        // ============== 顶点排序 ==============
        function orderPoints(pts) {
            if (pts.length !== 4) return null;
            // 按 y 排序
            const sorted = [...pts].sort((a, b) => a.y - b.y);
            const top = [sorted[0], sorted[1]].sort((a, b) => a.x - b.x);
            const bottom = [sorted[2], sorted[3]].sort((a, b) => a.x - b.x);
            // 返回: 左上、右上、右下、左下
            return [top[0], top[1], bottom[1], bottom[0]];
        }

        function dist(a, b) {
            return Math.sqrt((b.x - a.x) ** 2 + (b.y - a.y) ** 2);
        }

        // ============== 坐标判定（红/绿） ==============
        function isInsideGuideFrame(quad, guideRect) {
            if (!quad || quad.length !== 4) return false;
            const margin = 3; // 防抖容差
            const left = guideRect.x - margin;
            const top = guideRect.y - margin;
            const right = guideRect.right + margin;
            const bottom = guideRect.bottom + margin;

            for (const pt of quad) {
                if (pt.x < left || pt.x > right || pt.y < top || pt.y > bottom) {
                    return false;
                }
            }
            return true;
        }

        // video 坐标 → 预览区像素坐标
        function videoToPreview(vx, vy) {
            const video = dom.video;
            const area = dom.previewArea;
            const scaleX = area.clientWidth / video.videoWidth;
            const scaleY = area.clientHeight / video.videoHeight;
            return { x: vx * scaleX, y: vy * scaleY };
        }

        // ============== 绘制检测结果 ==============
        function drawDetection(quad) {
            const canvas = dom.overlayCanvas;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!quad || quad.length !== 4) return;

            const scaleX = canvas.width / dom.video.videoWidth;
            const scaleY = canvas.height / dom.video.videoHeight;
            const pts = quad.map(p => ({ x: p.x * scaleX, y: p.y * scaleY }));

            // 绘制半透明轮廓
            ctx.strokeStyle = state.isGreen ? 'rgba(0,255,0,0.5)' : 'rgba(255,100,100,0.4)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            for (let i = 1; i < 4; i++) ctx.lineTo(pts[i].x, pts[i].y);
            ctx.closePath();
            ctx.stroke();

            // 四角小圆点
            const color = state.isGreen ? '#00FF00' : '#FF4444';
            for (const pt of pts) {
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 4, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // ============== 透视变换与裁剪 ==============
        function doPerspectiveCrop(quad) {
            if (!state.opencvReady) {
                return doSimpleCrop(quad);
            }

            const video = dom.video;
            const src = new cv.Mat(video.videoHeight, video.videoWidth, cv.CV_8UC4);
            try {
                const cap = new cv.VideoCapture(video);
                cap.read(src);
                cap.delete();

                const outH = Math.round(OUTPUT_WIDTH / ID_CARD_ASPECT); // ≈ 540

                // 源四点（float32）
                const srcPts = cv.matFromArray(4, 1, cv.CV_32FC2, [
                    quad[0].x, quad[0].y,
                    quad[1].x, quad[1].y,
                    quad[2].x, quad[2].y,
                    quad[3].x, quad[3].y,
                ]);

                // 目标四点（标准矩形）
                const dstPts = cv.matFromArray(4, 1, cv.CV_32FC2, [
                    0, 0,
                    OUTPUT_WIDTH - 1, 0,
                    OUTPUT_WIDTH - 1, outH - 1,
                    0, outH - 1,
                ]);

                const M = cv.getPerspectiveTransform(srcPts, dstPts);
                const dst = new cv.Mat();
                cv.warpPerspective(src, dst, M, new cv.Size(OUTPUT_WIDTH, outH));

                // Mat → Canvas → DataURL
                const outCanvas = document.createElement('canvas');
                outCanvas.width = OUTPUT_WIDTH;
                outCanvas.height = outH;
                cv.imshow(outCanvas, dst);

                const dataUrl = outCanvas.toDataURL('image/jpeg', 0.92);

                srcPts.delete(); dstPts.delete(); M.delete(); dst.delete();
                src.delete();

                return { dataUrl, width: OUTPUT_WIDTH, height: outH };
            } catch (e) {
                console.warn('OpenCV透视变换失败，使用降级裁剪:', e);
                try { src.delete(); } catch (_) {}
                return doSimpleCrop(quad);
            }
        }

        function doSimpleCrop(quad) {
            const video = dom.video;
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);

            // 计算包围盒
            const xs = quad.map(p => p.x);
            const ys = quad.map(p => p.y);
            const minX = Math.max(0, Math.floor(Math.min(...xs)));
            const minY = Math.max(0, Math.floor(Math.min(...ys)));
            const maxX = Math.min(video.videoWidth, Math.ceil(Math.max(...xs)));
            const maxY = Math.min(video.videoHeight, Math.ceil(Math.max(...ys)));

            const w = maxX - minX;
            const h = maxY - minY;
            if (w <= 0 || h <= 0) return null;

            const outW = OUTPUT_WIDTH;
            const outH = Math.round(outW / (w / h));

            const outCanvas = document.createElement('canvas');
            outCanvas.width = outW;
            outCanvas.height = outH;
            const outCtx = outCanvas.getContext('2d');
            outCtx.drawImage(canvas, minX, minY, w, h, 0, 0, outW, outH);

            const dataUrl = outCanvas.toDataURL('image/jpeg', 0.92);
            return { dataUrl, width: outW, height: outH };
        }

        // ============== 抓拍流程 ==============
        async function triggerCapture(quad) {
            if (state.isProcessing) return;
            const now = Date.now();
            if (now - state.lastCaptureTime < CAPTURE_COOLDOWN_MS) return;

            state.isProcessing = true;
            state.lastCaptureTime = now;

            showFlash();

            // 短暂延迟让闪白显示
            await new Promise(r => setTimeout(r, 120));

            const result = doPerspectiveCrop(quad);

            if (!result) {
                state.isProcessing = false;
                setStatus('裁剪失败，请重试');
                return;
            }

            if (state.side === 'front') {
                state.frontImage = result.dataUrl;
                dom.thumbFront.src = result.dataUrl;
                dom.thumbFront.style.display = 'block';
                dom.thumbFront.classList.add('captured');
                state.side = 'back';
                state.greenFrameCount = 0;
                setGuideColor('red');
                setStatus('已捕获正面，请翻转至反面', 'green');
            } else {
                state.backImage = result.dataUrl;
                dom.thumbBack.src = result.dataUrl;
                dom.thumbBack.style.display = 'block';
                dom.thumbBack.classList.add('captured');
                state.side = 'done';
                setStatus('正反面均已采集完毕，请提交', 'green');
                dom.btnSubmit.disabled = false;
                stopDetectLoop();
            }

            state.isProcessing = false;
        }

        // ============== 手动抓拍（备用） ==============
        function manualCapture() {
            if (state.isProcessing || !state.videoReady) return;
            if (state.side === 'done') return;

            state.isProcessing = true;
            showFlash();

            setTimeout(() => {
                const video = dom.video;
                // 手动拍照：取整个画面并按身份证比例中心裁剪
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0);

                // 按身份证比例从画面中心裁剪最大区域
                const vw = video.videoWidth;
                const vh = video.videoHeight;
                let cw, ch;
                if (vw / vh > ID_CARD_ASPECT) {
                    ch = vh;
                    cw = Math.round(ch * ID_CARD_ASPECT);
                } else {
                    cw = vw;
                    ch = Math.round(cw / ID_CARD_ASPECT);
                }
                const cx = Math.round((vw - cw) / 2);
                const cy = Math.round((vh - ch) / 2);

                const outCanvas = document.createElement('canvas');
                outCanvas.width = OUTPUT_WIDTH;
                outCanvas.height = Math.round(OUTPUT_WIDTH / ID_CARD_ASPECT);
                const outCtx = outCanvas.getContext('2d');
                outCtx.drawImage(canvas, cx, cy, cw, ch, 0, 0, outCanvas.width, outCanvas.height);

                const dataUrl = outCanvas.toDataURL('image/jpeg', 0.92);

                saveCaptureResult(dataUrl);
                state.isProcessing = false;
            }, 150);
        }

        function saveCaptureResult(dataUrl) {
            if (state.side === 'front') {
                state.frontImage = dataUrl;
                dom.thumbFront.src = dataUrl;
                dom.thumbFront.style.display = 'block';
                dom.thumbFront.classList.add('captured');
                state.side = 'back';
                state.greenFrameCount = 0;
                setGuideColor('red');
                setStatus('已捕获正面（手动），请翻转至反面', 'green');
            } else {
                state.backImage = dataUrl;
                dom.thumbBack.src = dataUrl;
                dom.thumbBack.style.display = 'block';
                dom.thumbBack.classList.add('captured');
                state.side = 'done';
                setStatus('正反面均已采集完毕，请提交', 'green');
                dom.btnSubmit.disabled = false;
                stopDetectLoop();
            }
        }

        // ============== 上传照片降级 ==============
        function handleFileUpload(file, side) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    // 按身份证比例裁剪
                    const iw = img.width;
                    const ih = img.height;
                    let cw, ch;
                    if (iw / ih > ID_CARD_ASPECT) {
                        ch = ih;
                        cw = Math.round(ch * ID_CARD_ASPECT);
                    } else {
                        cw = iw;
                        ch = Math.round(cw / ID_CARD_ASPECT);
                    }
                    const cx = Math.round((iw - cw) / 2);
                    const cy = Math.round((ih - ch) / 2);

                    canvas.width = OUTPUT_WIDTH;
                    canvas.height = Math.round(OUTPUT_WIDTH / ID_CARD_ASPECT);
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, cx, cy, cw, ch, 0, 0, canvas.width, canvas.height);

                    const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
                    saveCaptureResult(dataUrl);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // ============== 检测主循环 ==============
        function startDetectLoop() {
            stopDetectLoop();
            let lastDetectTime = 0;

            function loop(timestamp) {
                state.detectLoopId = requestAnimationFrame(loop);

                if (state.side === 'done') return;
                if (!state.isStreaming || state.isProcessing) return;

                // 节流
                if (timestamp - lastDetectTime < DETECT_INTERVAL_MS) return;
                lastDetectTime = timestamp;

                syncCanvasSize();
                updateGuideFrameUI();

                // 执行检测
                let quad = null;
                if (state.opencvReady) {
                    quad = detectIDCardWithOpencv();
                } else {
                    quad = detectIDCardFallback();
                }

                const guideRect = getGuideFrameRect();

                // 将 video 坐标的 quad 映射到预览区坐标用于判定
                if (quad) {
                    const previewQuad = quad.map(p => videoToPreview(p.x, p.y));
                    const inside = isInsideGuideFrame(previewQuad, guideRect);

                    if (inside) {
                        state.greenFrameCount++;
                        if (state.greenFrameCount >= STABLE_FRAMES_FOR_GREEN && !state.isGreen) {
                            setGuideColor('green');
                            if (state.side === 'front') {
                                setStatus('正在检测...', 'green');
                            } else if (state.side === 'back') {
                                setStatus('正在检测反面...', 'green');
                            }
                        }
                        if (state.greenFrameCount >= STABLE_FRAMES_FOR_CAPTURE && state.side !== 'done') {
                            triggerCapture(quad);
                            state.greenFrameCount = 0;
                        }
                    } else {
                        state.greenFrameCount = 0;
                        if (state.isGreen) {
                            setGuideColor('red');
                            if (state.side === 'front') {
                                setStatus('请将身份证正面放入框内');
                            } else if (state.side === 'back') {
                                setStatus('请将身份证反面放入框内');
                            }
                        }
                    }

                    drawDetection(quad);
                } else {
                    state.greenFrameCount = 0;
                    if (state.isGreen) {
                        setGuideColor('red');
                        const sideLabel = state.side === 'front' ? '正面' : '反面';
                        setStatus(`请将身份证${sideLabel}放入框内`);
                    }
                    // 清除画布
                    const ctx = dom.overlayCanvas.getContext('2d');
                    ctx.clearRect(0, 0, dom.overlayCanvas.width, dom.overlayCanvas.height);
                }
            }

            state.detectLoopId = requestAnimationFrame(loop);
        }

        function stopDetectLoop() {
            if (state.detectLoopId) {
                cancelAnimationFrame(state.detectLoopId);
                state.detectLoopId = null;
            }
        }

        // ============== 重置 ==============
        function resetAll() {
            stopDetectLoop();
            state.side = 'front';
            state.frontImage = null;
            state.backImage = null;
            state.isGreen = false;
            state.greenFrameCount = 0;
            state.lastCaptureTime = 0;
            state.isProcessing = false;

            dom.thumbFront.src = '';
            dom.thumbFront.style.display = 'none';
            dom.thumbFront.classList.remove('captured');
            dom.thumbBack.src = '';
            dom.thumbBack.style.display = 'none';
            dom.thumbBack.classList.remove('captured');
            dom.btnSubmit.disabled = true;

            setGuideColor('red');
            setStatus('请将身份证正面放入框内');

            const ctx = dom.overlayCanvas.getContext('2d');
            ctx.clearRect(0, 0, dom.overlayCanvas.width, dom.overlayCanvas.height);

            if (state.isStreaming) {
                startDetectLoop();
            }
        }

        // ============== 提交 ==============
        function submitImages() {
            if (!state.frontImage || !state.backImage) return;

            const result = {
                front: {
                    image: state.frontImage,
                    side: 'front',
                    format: 'jpeg',
                },
                back: {
                    image: state.backImage,
                    side: 'back',
                    format: 'jpeg',
                },
                timestamp: new Date().toISOString(),
            };

            // 展示结果（实际项目中这里上传到后端）
            console.log('提交数据:', result);

            // 在新窗口展示结果
            const w = window.open('', '_blank', 'width=900,height=700');
            if (w) {
                w.document.write(`

        // ============== 事件绑定 ==============
        dom.btnSwitchCam.addEventListener('click', switchCamera);
        dom.btnManualCapture.addEventListener('click', manualCapture);
        dom.btnReset.addEventListener('click', resetAll);
        dom.btnSubmit.addEventListener('click', submitImages);
        dom.btnRetry.addEventListener('click', () => startCamera());

        dom.btnUpload.addEventListener('click', () => dom.fileInput.click());
        dom.fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            files.forEach((file, idx) => {
                const side = idx === 0 ? 'front' : 'back';
                if (state.side === 'front' && idx === 0) {
                    handleFileUpload(file, 'front');
                } else if ((state.side === 'back' || state.side === 'done') && idx < 2) {
                    handleFileUpload(file, state.side);
                }
            });
            dom.fileInput.value = '';
        });

        // 窗口大小变化时更新取景框
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                syncCanvasSize();
                updateGuideFrameUI();
            }, 200);
        });

        // 屏幕方向变化
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                syncCanvasSize();
                updateGuideFrameUI();
            }, 500);
        });

        // ============== 启动 ==============
        async function bootstrap() {
            showLoading('正在加载 OpenCV.js...');

            // 并行加载 OpenCV 和启动摄像头
            const opencvPromise = initOpencv();
            const cameraPromise = startCamera('environment');

            const hasOpencv = await opencvPromise;
            await cameraPromise;

            hideLoading();

            if (hasOpencv) {
                console.log('✅ OpenCV.js 加载成功，使用高精度检测');
            } else {
                console.warn('⚠️ OpenCV.js 加载失败，使用降级检测方案');
            }

            updateGuideFrameUI();
        }

        bootstrap();

        // 导出调试接口
        window.__idCardCapture = { state, startCamera, switchCamera, manualCapture, resetAll, submitImages };
    })();
    </script>
</body>
</html>
